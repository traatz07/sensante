<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SenSante - Pre-diagnostic</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-lg">

        <div class="max-w-4xl mx-auto px-4">

            <h1 class="text-2xl font-bold">
                SenSante
            </h1>

            <p class="text-blue-100 text-sm">
                Assistant pre-diagnostic medical
            </p>

        </div>

    </header>

    <!-- Main -->
    <main class="max-w-4xl mx-auto px-4 py-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Formulaire -->
            <div class="bg-white rounded-lg shadow-md p-6">

                <h2 class="text-xl font-bold mb-4 text-gray-800">
                    Informations Patient
                </h2>

                <form id="diagnostic-form" class="space-y-4">

                    <!-- Age -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        >
                    </div>

                    <!-- Sexe -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Sexe
                        </label>

                        <select
                            id="sexe"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        >
                            <option value="M">Masculin</option>
                            <option value="F">Feminin</option>
                        </select>
                    </div>

                    <!-- Temperature -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Temperature
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            id="temperature"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        >
                    </div>

                    <!-- Tension -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Tension systolique
                        </label>

                        <input
                            type="number"
                            id="tension_sys"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        >
                    </div>

                    <!-- Symptomes -->
                    <div class="space-y-2">

                        <h3 class="font-medium text-gray-700">
                            Symptomes
                        </h3>

                        <label class="flex items-center">
                            <input type="checkbox" id="toux" class="mr-2">
                            Toux
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" id="fatigue" class="mr-2">
                            Fatigue
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" id="maux_tete" class="mr-2">
                            Maux de tete
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" id="frissons" class="mr-2">
                            Frissons
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" id="nausee" class="mr-2">
                            Nausees
                        </label>

                    </div>

                    <!-- Region -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Region
                        </label>

                        <select
                            id="region"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        >
                            <option value="Dakar">Dakar</option>
                           <option value="Thiès">Thiès</option>
                            <option value="Saint-Louis">Saint-Louis</option>
                        </select>
                    </div>

                    <!-- Bouton -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700"
                    >
                        Obtenir le diagnostic
                    </button>

                </form>

            </div>

            <!-- Resultat -->
            <div class="bg-white rounded-lg shadow-md p-6">

                <h2 class="text-xl font-bold mb-4 text-gray-800">
                    Resultat du diagnostic
                </h2>

               <div id="result-content">

    <p class="text-gray-500">
        En attente d'un diagnostic...
    </p>

</div>

<hr class="my-6">

<h3 class="text-lg font-bold mb-2">
    Historique des consultations
</h3>

<ul id="history-list" class="space-y-2 text-sm">

</ul>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-400 text-sm py-4">

        SenSante v0.3 - ESP/UCAD - L2 GLSI 2026

    </footer>

    <!-- JavaScript -->
    <script>

        const form = document.getElementById("diagnostic-form");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const patientData = {

                age: parseInt(document.getElementById("age").value),

                sexe: document.getElementById("sexe").value,

                temperature: parseFloat(
                    document.getElementById("temperature").value
                ),

                tension_sys: parseInt(
                    document.getElementById("tension_sys").value
                ),

                toux: document.getElementById("toux").checked,
                fatigue: document.getElementById("fatigue").checked,
                maux_tete: document.getElementById("maux_tete").checked,
                frissons: document.getElementById("frissons").checked,
                nausee: document.getElementById("nausee").checked,

                region: document.getElementById("region").value
            };

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(patientData)
                    }
                );

                const result = await response.json();

                displayResult(result);

            } catch (error) {

                alert("Erreur connexion API");

                console.error(error);
            }
        });
        const historyList = document.getElementById("history-list");

        function displayResult(result) {

            const resultDiv = document.getElementById("result-content");

            let html = `
                <div class="space-y-4">

                    <div class="p-4 bg-blue-50 rounded-lg">

                        <h3 class="font-bold text-lg text-blue-800">
                            Diagnostic :
                        </h3>

                        <p class="text-2xl font-bold text-blue-600">

    ${
        result.diagnostic === "grippe"
        ? "🤧 Grippe"

        : result.diagnostic === "paludisme"
        ? "🦟 Paludisme"

        : result.diagnostic === "typhoide"
        ? "🤒 Typhoide"

        : "✅ Sain"
    }

</p>

                    </div>

                    <div>

                        <h4 class="font-semibold mb-2">
                            Probabilites :
                        </h4>
            `;

            for (const [disease, probability] of Object.entries(result.probabilites)) {

                const percentage = (probability * 100).toFixed(1);

                html += `
                    <div class="mb-2">

                        <div class="flex justify-between text-sm">

                            <span>${disease}</span>
                            <span>${percentage}%</span>

                        </div>

                        <div class="w-full bg-gray-200 rounded-full h-2">

                            <div
                                class="bg-blue-600 h-2 rounded-full"
                                style="width: ${percentage}%"
                            ></div>

                        </div>

                    </div>
                `;
            }

            html += `</div></div>`;

            resultDiv.innerHTML = html;

            const item = document.createElement("li");

item.className =
    "p-2 bg-gray-100 rounded";

item.textContent =
    `Diagnostic : ${result.diagnostic}`;

historyList.prepend(item);
        }

    </script>

</body>
</html>
